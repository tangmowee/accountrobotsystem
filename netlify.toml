# Netlify config — โฮสต์หน้าเว็บ/มือถือ ส่วน Firebase ใช้เป็นฐานข้อมูล+ล็อกอิน (backend)
# ตั้ง publish directory = public (หน้ามือถือพนักงานอยู่ที่ /, แดชบอร์ดแอดมินอยู่ที่ /dashboard)

[build]
  publish = "public"
  # ไม่มีขั้นตอน build (เป็น static HTML/JS ล้วน)
  command = ""

# clean URL: /dashboard -> dashboard.html
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# ไม่แคชไฟล์ HTML/JS เพื่อให้พนักงานได้เวอร์ชันล่าสุดเสมอ
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
