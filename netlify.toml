# Netlify — โฮสต์หน้าเว็บ/มือถือ ส่วน Firebase = ฐานข้อมูล+ล็อกอิน (backend)
# / = เมนูรวมระบบ (Hub) • /checkin = แอปพนักงาน • /admin = HR • /jr360 • /finance

[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/checkin"
  to = "/checkin.html"
  status = 200

[[redirects]]
  from = "/jr360"
  to = "/RSC-JR360.html"
  status = 200

[[redirects]]
  from = "/finance"
  to = "/finance.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
