# Netlify — โฮสต์หน้าเว็บ/มือถือ ส่วน Firebase = ฐานข้อมูล+ล็อกอิน (backend)
# / = หน้ามือถือพนักงาน (index.html) • /admin = หน้า HR admin (admin.html)

[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
