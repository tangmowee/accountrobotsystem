<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0B0D">
<title>RSC Connect — เมนูรวมระบบ</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{--orange:#F97316;--orange-light:#FB923C;--dark:#0A0B0D;--dark2:#0E0F13;--card:rgba(255,255,255,.035);
    --border:rgba(255,255,255,.08);--text:#EAEAF0;--muted:#7C808C;--green:#34D399;--yellow:#FBBF24;--cyan:#22D3EE;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{color:var(--text);font-family:'Prompt',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
    background:radial-gradient(760px 400px at 12% -6%,rgba(249,115,22,.14),transparent 60%),radial-gradient(680px 380px at 100% 0,rgba(34,211,238,.08),transparent 55%),linear-gradient(180deg,var(--dark),var(--dark2));background-attachment:fixed;}
  .topbar{background:var(--dark2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo{width:34px;height:34px;background:var(--orange);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;}
  .brand b{font-family:'Space Grotesk','Prompt',sans-serif;letter-spacing:2px;font-size:19px;}
  .conn{font-family:monospace;font-size:10px;padding:2px 8px;border-radius:20px;}
  .conn.cloud{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.3);}
  .conn.local{background:rgba(243,156,18,.12);color:var(--yellow);border:1px solid rgba(243,156,18,.3);}
  .user{font-size:12px;color:var(--muted);}
  .user a{color:var(--orange-light);cursor:pointer;}
  .wrap{max-width:920px;margin:0 auto;padding:34px 18px 60px;}
  .hi{font-family:'Space Grotesk','Prompt',sans-serif;font-size:30px;font-weight:600;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .tile{position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;backdrop-filter:blur(8px);transition:.15s;}
  .tile::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent,var(--orange)),transparent);}
  .tile:hover{border-color:var(--accent,var(--orange));transform:translateY(-3px);box-shadow:0 14px 40px -22px var(--accent,var(--orange));}
  .tile.lock{opacity:.4;pointer-events:none;filter:grayscale(.5);}
  .ico{font-size:30px;margin-bottom:12px;display:block;}
  .tile h3{font-size:18px;font-weight:600;margin-bottom:5px;}
  .tile p{color:var(--muted);font-size:13px;line-height:1.45;}
  .badge{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
  .badge.on{color:var(--accent,var(--orange));border-color:var(--accent,var(--orange));}
  .note{color:var(--muted);font-size:12.5px;margin-top:26px;text-align:center;}
  /* login */
  .overlay{position:fixed;inset:0;background:rgba(5,5,5,.96);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
  .overlay.show{display:flex;}
  .lcard{width:100%;max-width:390px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;}
  .lcard h2{font-family:'Space Grotesk','Prompt',sans-serif;letter-spacing:2px;font-size:24px;margin-bottom:2px;}
  .lcard .s{color:var(--muted);font-size:12px;margin-bottom:14px;}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;}
  input{width:100%;background:var(--dark2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Prompt',sans-serif;font-size:16px;padding:13px;outline:none;}
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12);}
  .btn{width:100%;font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;border:none;background:var(--orange);color:#fff;padding:14px;border-radius:10px;cursor:pointer;margin-top:16px;}
  .err{color:#F87171;font-size:13px;min-height:18px;margin-top:8px;}
</style>
</head>
<body>

<div class="overlay" id="login">
  <div class="lcard">
    <div class="logo" style="margin-bottom:14px;"><svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27h10"/><path d="M11 27V16.5"/><circle cx="11" cy="15" r="1.9" fill="#fff" stroke="none"/><path d="M12.6 13.7 21 8"/><circle cx="22.5" cy="7" r="1.9" fill="#fff" stroke="none"/><path d="M24.2 6h3M25.7 4.2v3.6"/></svg></div>
    <h2>RSC Connect</h2><div class="s">เข้าสู่ระบบเพื่อเข้าใช้งานทุกระบบ</div>
    <label>ชื่อผู้ใช้ / รหัสพนักงาน</label><input id="lu" autocomplete="username" placeholder="เช่น joe หรือ 601215">
    <label>รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="err" id="le"></div>
  </div>
</div>

<div class="topbar">
  <div class="brand"><div class="logo"><svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 27h10"/><path d="M11 27V16.5"/><circle cx="11" cy="15" r="1.9" fill="#fff" stroke="none"/><path d="M12.6 13.7 21 8"/><circle cx="22.5" cy="7" r="1.9" fill="#fff" stroke="none"/><path d="M24.2 6h3M25.7 4.2v3.6"/></svg></div><b>RSC Connect</b></div>
  <div style="display:flex;align-items:center;gap:12px;"><span class="conn local" id="conn">LOCAL</span><span class="user" id="who"></span></div>
</div>

<div class="wrap">
  <div class="hi" id="greet">ยินดีต้อนรับ</div>
  <div class="sub">เลือกระบบที่ต้องการใช้งาน — เห็นเฉพาะระบบที่คุณมีสิทธิ์เข้าถึง</div>
  <div class="grid" id="tiles"></div>
  <div class="note" id="note"></div>
</div>

<script>
const CFG=window.FIREBASE_CONFIG||{apiKey:''};
const DOMAIN=window.LOGIN_DOMAIN||'rsc.local';
let MODE='local',db=null,auth=null,ROLE='',NAME='';
const $=id=>document.getElementById(id);
const short=e=>(e||'').split('@')[0];
const esc=s=>(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ทุกระบบ + สิทธิ์ที่เข้าถึงได้ */
const APPS=[
  {href:'checkin.html', ico:'🕐', accent:'#F97316', title:'ลงเวลา / เช็คอิน', desc:'เช็คอิน-เอาท์ GPS · ขอลา · OT · จองรถ · บันทึกเวลาตาม JR', roles:'*'},
  {href:'admin',        ico:'📊', accent:'#22D3EE', title:'แดชบอร์ด HR', desc:'ภาพรวมวันนี้ · Planner · อนุมัติลา/OT · รายงาน · ชั่วโมงตาม JR · พนักงาน', roles:['supervisor','manager','hr','director','admin']},
  {href:'RSC-JR360.html', ico:'📈', accent:'#FB923C', title:'JR 360 (ผู้บริหาร)', desc:'ภาพรวมงานตามเลข JR · เปรียบเทียบ DL งบ vs จริง · สรุปรายปี', roles:['manager','hr','director','admin']},
  {href:'finance.html', ico:'💰', accent:'#34D399', title:'แดชบอร์ดการเงิน', desc:'สรุปการเงินบริษัท (ข้อมูลลับ — เฉพาะผู้บริหาร/บัญชี)', roles:['manager','hr','director','admin','finance']},
];
const can=a=>a.roles==='*'||(MODE==='local')||a.roles.includes(ROLE);

function render(){
  $('greet').textContent=NAME?('สวัสดี, '+NAME):'ยินดีต้อนรับ';
  $('tiles').innerHTML=APPS.map(a=>{const ok=can(a);
    const inner=`<span class="ico">${a.ico}</span><h3>${a.title}</h3><p>${a.desc}</p>
      <span class="badge ${ok?'on':''}">${ok?'เปิดใช้งาน →':'🔒 ไม่มีสิทธิ์'}</span>`;
    return ok?`<a class="tile" style="--accent:${a.accent}" href="${a.href}">${inner}</a>`
             :`<div class="tile lock" style="--accent:${a.accent}">${inner}</div>`;
  }).join('');
  $('note').innerHTML=MODE==='local'
    ?'⚠️ โหมดทดลอง (ยังไม่ได้ตั้งค่า Firebase) — แสดงทุกระบบ · เมื่อเปิดใช้จริงจะเห็นเฉพาะตามสิทธิ์'
    :'สิทธิ์ของคุณ: <b style="color:var(--orange-light)">'+esc(ROLE||'พนักงาน')+'</b> · ระบบอื่นถูกล็อกตามระดับสิทธิ์';
}

function doLogin(){const raw=$('lu').value.trim(),p=$('lp').value;$('le').textContent='';
  const e=raw.includes('@')?raw:raw+'@'+DOMAIN;
  auth.signInWithEmailAndPassword(e,p).catch(x=>$('le').textContent='เข้าสู่ระบบไม่สำเร็จ: '+(x.code||x.message));}
function doLogout(){if(auth)auth.signOut();}

function onAuth(u){
  if(!u){$('login').classList.add('show');$('who').textContent='';return;}
  $('login').classList.remove('show');
  db.collection('rsc').doc('rsc_employees').get().then(s=>{
    const emps=(s.exists&&s.data().items)||[];const key=short(u.email);
    const me=emps.find(x=>x.email===key||x.email===u.email||short(x.email)===key);
    ROLE=(me&&me.role)||'employee';NAME=(me&&me.name)||key;
    $('who').innerHTML=esc(NAME)+' · '+esc(ROLE)+' · <a onclick="doLogout()">ออก</a>';
    render();
  }).catch(()=>{ROLE='employee';NAME=short(u.email);render();});
}

/* init */
if(CFG.apiKey&&typeof firebase!=='undefined'){
  try{firebase.initializeApp(CFG);db=firebase.firestore();auth=firebase.auth();MODE='firebase';
    $('conn').className='conn cloud';$('conn').textContent='CLOUD';
    auth.onAuthStateChanged(onAuth);
  }catch(e){MODE='local';render();}
}else{
  MODE='local';$('who').textContent='โหมดทดลอง';render();
}
</script>
</body>
</html>
